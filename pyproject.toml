[build-system]
# Cython extensions are built from setup.py; Cython must be present at build time
# (setuptools>=64 can resolve the pyproject metadata + setup.py ext_modules).
requires = ["setuptools>=64", "cython>=3.0", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
name = "GPEvo"
version = "0.1.0"
description = "GPEvo: Python port of the USPEX-GP 310 molecular-crystal evolutionary search with GP-guided active learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "FengGo"}]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "networkx>=2.6",
    "spglib>=2.0",
    # uspexkit (vendored under gpevo.uspexkit) runtime deps
    "scikit-learn>=1.0",
    "ase>=3.22",
    "irff",
    "pymatgen",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
# 发行名是 GPEvo；命令按 CLI 惯例保持小写。
gpevo = "gpevo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpevo*"]

[tool.setuptools.package-data]
gpevo = [
    "FunctionFolder/spacegroup/__init__.py",
    "FunctionFolder/spacegroup/random_cell_mol.py",
    "FunctionFolder/spacegroup/random_cell_mol",
    "FunctionFolder/spacegroup/data/*.txt",
    "FunctionFolder/sys/uspex_fast_core.pyx",
    "FunctionFolder/sys/*.so",
    # vendored uspexkit subset (gp/pred/calc/add)
    "uspexkit/*.pyx",
    "uspexkit/*.c",
    "uspexkit/LICENSE",
]

# Cython extensions are defined in setup.py (it resolves numpy's include path
# at build time, which the static pyproject ext-modules table cannot).

